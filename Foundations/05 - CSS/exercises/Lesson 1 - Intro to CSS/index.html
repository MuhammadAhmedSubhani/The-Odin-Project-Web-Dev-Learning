<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
        <h1> Adding CSS to HTML </h1>
        <ol>
            <li> External CSS </li>
            <li> Internal CSS </li>
            <li> Inline CSS </li>
        </ol>
        <!-- index.html -->

        <div>Hello, World!</div>
        <div>Hello again!</div>
        <p>Hi...</p>
        <div>Okay, bye.</div>

        <div class="alert-message"> Must follow these rules and regulations. </div>
        <div id="title">WAZZZUPP</div>
        <!-- <div class="Hi"> Emotion hi </div>
        <div class="Hello"> Emotion hello </div> -->

        <div>
        <div class="subsection header">Latest Posts</div>
        <p class="subsection" id="preview"> This is where a preview for a post might go. </p>
        </div>

        <div class="parent">
            <p class="child">First</p>
            <div>
                <p class="child">Second</p>
            </div>
        </div>

        <p class="child">Third</p>

</body>
</html>
